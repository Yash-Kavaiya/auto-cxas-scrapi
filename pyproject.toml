[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-cxas-scrapi"
version = "0.1.0"
description = "Autonomous optimization loop for Google Cloud CX Agent Studio using cxas-scrapi"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yash Kavaiya" }]
license = { text = "Apache-2.0" }
keywords = ["dialogflow", "cx-agent-studio", "cxas", "autonomous-ai", "llm", "optimization"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "PyYAML>=6.0.1",
  "tenacity>=8.2.3",
  "httpx>=0.27.0",
  "orjson>=3.10.3",
  "python-dotenv>=1.0.1",
  "gitpython>=3.1.43",
  "cxas-scrapi",
]

[project.optional-dependencies]
gemini    = ["google-generativeai>=0.7.0", "google-cloud-aiplatform>=1.55.0"]
openai    = ["openai>=1.30.1"]
anthropic = ["anthropic>=0.28.0"]
dev = [
  "pytest>=8.1.1",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.23.6",
  "ruff>=0.4.2",
  "mypy>=1.10.0",
  "pre-commit>=3.7.0",
  "types-PyYAML>=6.0.12",
]
all = ["auto-cxas-scrapi[gemini,openai,anthropic,dev]"]

[project.scripts]
auto-cxas = "auto_cxas_scrapi.cli.main:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath   = ["src"]
testpaths    = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select  = ["E", "F", "I", "UP", "B", "SIM"]
ignore  = ["E501"]

[tool.mypy]
python_version     = "3.11"
strict             = true
warn_return_any    = true
warn_unused_configs = true
