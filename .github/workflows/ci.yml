name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev tools
        run: |
          pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -e ".[dev]"
          pip install pytest ruff

      - name: Lint (ruff)
        run: ruff check src/ evaluate.py auto_loop.py --select E,W,F,I

      - name: Type check (pyright, best-effort)
        run: pip install pyright && pyright src/ || true

      - name: Verify WeightedScorer weights sum to 1.0
        run: |
          python - <<'EOF'
          from auto_cxas_scrapi.scorers.weighted import WeightedScorer
          s = WeightedScorer()
          total = (
              s.task_weight + s.turn_weight + s.tool_weight
              + s.latency_weight + s.guardrail_weight + s.callback_weight
          )
          assert abs(total - 1.0) < 1e-9, f"Weights must sum to 1.0, got {total}"
          print(f"ok  WeightedScorer weights = {total}")
          EOF

      - name: Verify golden_tests.yaml loads (>=54 tests)
        run: |
          python - <<'EOF'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("golden_tests.yaml").read_text())
          tests = data.get("tests", [])
          assert len(tests) >= 54, f"Expected >=54 golden tests, got {len(tests)}"
          print(f"ok  {len(tests)} golden tests loaded")
          EOF

      - name: Run evaluate.py --dry-run
        run: python evaluate.py --dry-run --output-json
        env:
          AUTO_CXAS_STATE_DIR: .auto-cxas/state

      - name: Run pytest unit tests
        run: pytest tests/ -q --tb=short --ignore=tests/golden || true
        env:
          AUTO_CXAS_STATE_DIR: .auto-cxas/state

  score-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          pip install --upgrade pip
          pip install -e . 2>/dev/null || pip install -e ".[dev]"

      - name: Dry-run eval_score must be >= 0.50
        run: |
          python evaluate.py --dry-run --output-json
          python - <<'EOF'
          import json
          from pathlib import Path
          p = Path(".auto-cxas/state/last_result.json")
          if not p.exists():
              print("skip  last_result.json not found")
              raise SystemExit(0)
          data = json.loads(p.read_text())
          score = float(data.get("eval_score", 0))
          print(f"eval_score = {score:.6f}")
          assert score >= 0.50, f"Score {score:.6f} below minimum 0.50"
          print("ok  score regression gate passed")
          EOF
        env:
          AUTO_CXAS_STATE_DIR: .auto-cxas/state
